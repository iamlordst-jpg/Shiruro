name: Shiruro
options:
  bundleIdPrefix: app.shiruro
  deploymentTarget:
    iOS: "16.0"
targets:
  Shiruro:
    type: application
    platform: iOS
    sources:
      - path: Shiruro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.shiruro.ios
        PRODUCT_NAME: Shiruro
        INFOPLIST_KEY_CFBundleDisplayName: Shiruro
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
